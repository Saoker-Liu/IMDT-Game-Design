<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾海对弈 · 星罗棋布美术试制</title>
<link rel="stylesheet" href="./cards.css?v=5.1.3">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1921; color: #efe4c8; font: 15px/1.55 system-ui,sans-serif; }
  main { max-width: 1120px; margin: auto; padding: 16px; }
  h1 { margin: 8px 0; font-size: clamp(20px,4vw,28px); }
  p { color: #bacac5; }
  .settings { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
  select { color: inherit; background: #22383c; padding: 5px; border: 1px solid #897f61; border-radius: 4px; }
  .chart { position: relative; overflow: hidden; border: 1px solid #9d8b64; border-radius: 6px; background: #142e3a; }
  .battlefield { position: relative; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .chart[data-view="concept"] .battlefield { background: url('./assets/archipelago-coastal-shelf.png') center top / 100% 131.579% no-repeat; }
  .chart[data-view="concept"] .shelf { background: #313629 url('./assets/archipelago-coastal-shelf.png') center bottom / 100% 416.667% no-repeat; }
  .reef-alignment { display: none; }
  .chart[data-view="concept"] .reef-alignment { display: block; }
  .reef-alignment, .reef-patch {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .reef-patch { mask-image: radial-gradient(ellipse var(--rx) var(--ry) at var(--x) var(--y), #000 83%, transparent); }
  .reef-patch.water { background: url('./assets/ocean-chart.webp') center / cover; }
  .reef-patch.water.local-water { background: none; }
  .reef-patch.local-water::after {
    content: '';
    position: absolute;
    inset: 0;
    background: url('./assets/archipelago-coastal-shelf.png') center top / 100% 131.579% no-repeat;
    transform: translateY(var(--water-shift));
  }
  .reef-patch.rock {
    background: url('./assets/archipelago-coastal-shelf.png') center top / 100% 131.579% no-repeat;
    transform-origin: var(--pivot) 0;
    transform: translate(var(--dx),var(--dy)) scaleX(var(--scale));
  }
  .side { z-index: 1; min-width: 0; aspect-ratio: 1; position: relative; background: linear-gradient(#30899322 84%, transparent); }
  .enemy { background: linear-gradient(#9d634b24 84%, transparent); border-left: 1px dashed #f0d7a5ad; }
  .chart[data-view="original"] { background-image: url('./assets/ocean-chart.webp'); }
  .chart[data-view="original"] .side { background-image: url('./assets/chart-archipelago-0-v3.webp'); background-size: 100% 100%; }
  .chart[data-view="original"] .enemy { background-image: url('./assets/chart-archipelago-1-v3.webp'); }
  .rules { position: absolute; inset: 0; width: 100%; height: 100%; background-image: linear-gradient(to right,#eee2c139 1px,transparent 1px),linear-gradient(to bottom,#eee2c139 1px,transparent 1px); background-size: 10% 10%; }
  .rules path { fill: #edd6a314; stroke: #ead8b099; stroke-width: 1; }
  .side-label { position: absolute; top: 7px; left: 7px; padding: 2px 7px; background: #0e2027d9; color: #b8e8dc; font-size: 12px; }
  .enemy .side-label { color: #f2c6a9; }
  .miniature { position: absolute; object-fit: contain; filter: drop-shadow(0 3px 3px #010d13a0); }
  .battleship { left: 10%; top: 30%; width: 40%; height: 10%; }
  .destroyer { left: 70%; top: 50%; width: 20%; height: 10%; }
  .shelf { z-index: 2; position: relative; display: grid; justify-items: center; padding: 30px 8px 18px; }
  .chart[data-view="original"] .shelf { padding-top: 10px; border-top: 1px solid #e8d1a578; }
  .shelf h2 { margin: 0 0 5px; font-size: 13px; text-shadow: 0 1px 5px #00131b; }
  .sample-hand { display: flex; justify-content: center; gap: 7px; width: 100%; }
  .sample-hand .tactical-card { flex: 0 1 144px; min-height: 0; cursor: default; }
  .sample-hand .card-description { flex: 1; }
  @media (max-width: 480px) {
    main { padding: 8px; }
    .sample-hand .card-top { padding-inline: 2px; gap: 3px; }
    .sample-hand .card-cost { width: 19px; height: 19px; font-size: 12px; }
    .sample-hand .preview-illustration { height: 46px; }
    .sample-hand .preview-illustration img { height: 40px; }
  }
</style>
<main>
  <h1>星罗棋布 · 连续海图试制</h1>
  <div class="settings">
    <label>海图 <select id="chart-view"><option value="concept">连续海图概念</option><option value="original">原版双区对照</option></select></label>
    <label><input id="rule-view" type="checkbox" checked> 显示原版礁石格与格线</label>
  </div>
  <div class="chart" data-view="concept">
    <div class="battlefield">
      <div class="reef-alignment" aria-hidden="true"></div>
      <div class="side"><svg class="rules" viewBox="0 0 100 100" aria-hidden="true"></svg><span class="side-label">己方海域</span><img class="miniature battleship" src="./assets/fleet-battleship.webp" alt="己方战列舰"><img class="miniature destroyer" src="./assets/fleet-destroyer.webp" alt="己方驱逐舰"></div>
      <div class="side enemy"><svg class="rules" viewBox="0 0 100 100" aria-hidden="true"></svg><span class="side-label">敌方海域</span></div>
    </div>
    <section class="shelf" aria-labelledby="hand-title">
      <h2 id="hand-title">战术手牌 · 非交战水域</h2>
      <div class="sample-hand"></div>
    </section>
  </div>
  <p>美术样板。叠加线沿用原版禁航坐标，岩岸下方为手牌区。</p>
</main>
<script type="module">
  import { terrainFor } from './terrain.mjs?v=5.1.0';
  import { regionContours } from './chart-art.mjs?v=5.1.0';
  import { cardGuide } from './cards-ui.mjs?v=5.1.3';

  const chart = document.querySelector('.chart');
  // Source image patches measured in cells on the combined 20 × 10 board.
  const reefPatches = [
    { x:7.32, y:.94, rx:1.79, ry:1.09, dx:-.5, dy:0 }, // Friendly upper reef
    { x:6.30, y:4.96, rx:1.62, ry:1.37, dx:0, dy:1/3 }, // Friendly middle reef
    { x:4.63, y:9.03, rx:.81, ry:.66, dx:0, dy:.5, waterShift:1.15 }, // Friendly bottom outcrop
    { x:8.27, y:7.72, rx:1.48, ry:1.14, dx:-.10, dy:.24 }, // Friendly lower-right reef
    { x:11.52, y:1.84, rx:1.46, ry:1.17, dx:.26, dy:.09 }, // Enemy upper-left reef
    { x:15.32, y:.55, rx:.85, ry:.55, dx:.20, dy:0 }, // Enemy top outcrop
    { x:13.80, y:4.80, rx:1.49, ry:1.12, dx:.18, dy:.14 }, // Enemy center reef
    { x:12.4, y:7.75, rx:1.66, ry:1.30, dx:0, dy:1, scale:.78, pivot:13.8 }, // Enemy lower-left reef
    { x:17.97, y:7.79, rx:1.5, ry:1.13, dx:.15, dy:.22 }, // Enemy lower-right reef
  ];
  const alignment = document.querySelector('.reef-alignment');
  const waters = [], rocks = [];
  for (const {x,y,rx,ry,dx,dy,scale=1,pivot=x,waterShift} of reefPatches) {
    const water = document.createElement('span');
    water.className = 'reef-patch water';
    for (const [name,value] of Object.entries({x:x*5,y:y*10,rx:rx*5,ry:ry*10})) {
      water.style.setProperty('--'+name,value+'%');
    }
    const rock = water.cloneNode();
    rock.className = 'reef-patch rock';
    rock.style.setProperty('--dx',dx*5+'%');
    rock.style.setProperty('--dy',dy*10+'%');
    rock.style.setProperty('--scale',scale);
    rock.style.setProperty('--pivot',pivot*5+'%');
    if (waterShift) {
      water.classList.add('local-water');
      water.style.setProperty('--water-shift',waterShift*10+'%');
    }
    waters.push(water);
    rocks.push(rock);
  }
  alignment.append(...waters,...rocks);
  const ruleLayers = [...document.querySelectorAll('.rules')];
  ruleLayers.forEach((layer,index) => {
    for (const contour of regionContours(terrainFor('archipelago',index),'rock')) {
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',contour);
      path.setAttribute('vector-effect','non-scaling-stroke');
      layer.append(path);
    }
  });
  document.querySelector('#chart-view').addEventListener('change',event => { chart.dataset.view = event.target.value; });
  document.querySelector('#rule-view').addEventListener('change',event => {
    for (const layer of ruleLayers) layer.style.visibility = event.target.checked ? 'visible' : 'hidden';
  });
  const guide = document.createElement('template');
  guide.innerHTML = cardGuide({previewArt:true,icon:() => ''});
  document.querySelector('.sample-hand').append(...['main','flare','maneuver'].map(type => guide.content.querySelector('.card-'+type)));
</script>
</html>
