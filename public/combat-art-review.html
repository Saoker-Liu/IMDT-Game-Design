<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雾海对弈 · 交战效果对照</title>
<link rel="stylesheet" href="./style.css?v=3.0.0">
<link rel="stylesheet" href="./visual.css?v=5.2.9">
<link rel="stylesheet" href="./naval.css?v=5.2.17">
<style>
  body { margin: 0; color: #e6dcc0; }
  main { max-width: 1050px; margin: auto; padding: 22px; }
  h1 { font-size: 22px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 16px 0; }
  .controls button, select { background: #21383e; color: #e6dcc0; border: 1px solid #81795e; padding: 7px 12px; border-radius: 4px; font: inherit; }
  .sample { display: grid; grid-template-columns: minmax(0,600px) minmax(180px,1fr); gap: 24px; }
  .board-matrix { aspect-ratio: 1; position: relative; overflow: hidden; }
  .board-effects,.lines { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10,1fr); grid-template-rows: repeat(10,1fr); pointer-events: none; }
  .lines { z-index: 1; background-image: linear-gradient(#d8dac533 1px,transparent 1px),linear-gradient(90deg,#d8dac533 1px,transparent 1px); background-size: 10% 10%; }
  .ships { position: absolute; inset: 0; z-index: 2; }
  .effect { min-width: 0; min-height: 0; }
  .tactical-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10,1fr); grid-template-rows: repeat(10,1fr); z-index: 1; pointer-events: none; }
  .tactical-grid .cell { opacity: 1; border: 0; min-width: 0; padding: 0; position: relative; }
  .baseline .torpedo-wake { display: none; }
  .baseline .cell.torpedo-track { border-bottom: 1px dashed #b1d8cfb5; }
  .baseline .sight-light { background: #eddeb52c; } .baseline .cell.smoke-cell { background-image: radial-gradient(ellipse,#a3b0ad7a,#6a79794a 55%,transparent 80%); } .baseline .cell.smoke-cell::before { inset: 6%; border-radius: 42%; background: #a8b2ad30; } aside { color: #adc0bc; line-height: 1.9; }
  aside p { margin-bottom: 18px; }
  .baseline .fire-art { width: 110%; height: 145%; left: -5%; bottom: 23%; }
  @media(max-width:700px) { .sample { grid-template-columns: 1fr; } main { padding: 14px; } }
</style>
<main>
  <h1>交战效果对照</h1>
  <div class="controls">
    <label>版本 <select id="version"><option value="refined">精修版本</option><option value="baseline">修改前</option></select></label>
    <label>场景 <select id="scene"><option value="fire">炮击与沉没</option><option value="illumination">照明弹</option><option value="smoke">烟幕</option><option value="torpedo">鱼雷</option><option value="triple">三行鱼雷</option><option value="diagonal">斜向鱼雷</option><option value="overlap">照明叠烟幕</option></select></label>
    <button id="replay">发射／重播</button>
    <label><input id="still" type="checkbox"> 显示完成状态</label>
  </div>
  <p id="playback" role="status" style="margin-bottom:12px;color:#c9d6b9">尚未发射</p><div class="sample">
    <div class="hostile-chart"><div class="board-matrix"><div class="ships"></div><div class="lines"></div><div class="board-effects"></div></div></div>
    <aside>
      <p>此页为效果样板，使用正式对局的舰船、火焰、水花与残骸绘制。</p>
      <p>上方：四格落空，观察水柱消退后的水环。<br>中部：连续命中，观察烟柱与上方舰艇的遮挡。<br>下方：沉没残骸，观察与燃烧状态的区分。</p>
      <p>切换“修改前”比较烟柱范围；重播可观察短闪光接持续烟火。显示完成状态用于核对落点。</p>
      <a href="/">进入人机演习 →</a>
    </aside>
  </div>
</main>
<script type="module">
  import { impactArt, shipOverlay, playStrikeEffects, illuminationArt, sightedHullArt, playTacticalEntrance } from './art.mjs?v=5.2.17';
  const board=document.querySelector('.board-matrix'), scene=document.querySelector('#scene'), version=document.querySelector('#version'), still=document.querySelector('#still'), status=document.querySelector('#playback');
  const misses=[16,17,26,27], hits=[43,44,53,54], sunk=[72,73];
  const states=new Map([...misses.map(c=>[c,'miss']),...hits.map(c=>[c,'hit']),...sunk.map(c=>[c,'sunk'])]);
  const lit=[24,25,26,34,35,36,44,45,46], cloud=[43,44,45,53,54,55,63,64,65], trace=[50,51,52,53,54,55,56,57];
  const paths={torpedo:[trace],triple:[[30,31,32,33,34,35,36,37,38],[40,41,42,43,44,45,46],[50,51,52,53,54,55,56,57]],diagonal:[[11,22,33,44,55,66,77,88]]};
  const blockingSmoke=[35,36,45,46,55],unblockedLight=lit.filter(cell=>!blockingSmoke.includes(cell));
  let generation=0, timers=[];
  const descriptions={
    fire:'持续烟火缩小并下移，减少对上方邻格的遮挡。重播查看短闪光接持续燃烧。',
    illumination:'修改前：照明区域直接亮起。精修：中心爆闪，先亮中心格，再向周围八格扩散；舰体始终按现有可见格裁切。',
    smoke:'修改前：每格一个圆形烟团直接出现。精修：多层不规则灰雾渐渐铺开，格线和己方舰体保持可辨认。',
    torpedo:'修改前：底边虚线直接出现。精修：小型金属鱼雷沿路径推进，留下窄水花；水花从后向前依次淡去。',
    triple:'三行鱼雷分别推进并在各自终点消失，检查相邻水花是否互相干扰。此处使用固定路径示意，实战以实际阻挡回执为准。',
    diagonal:'斜向鱼雷的弹体中心应始终贴合航迹格心，尾翼、水花方向随航线旋转。',
    overlap:'烟幕先覆盖部分格子，照明爆闪后只展开可见部分；被烟幕挡住的格子保持原样，舰体仍按可见格裁切。',
  };
  function cancel(){generation++;for(const id of timers)clearTimeout(id);timers=[];for(const a of board.getAnimations({subtree:true}))a.cancel();}
  function grid(smoke=[],path=[]){return `<div class="tactical-grid">${Array.from({length:100},(_,c)=>`<span class="cell ${smoke.includes(c)?'smoke-cell':''} ${path.includes(c)?'torpedo-track':''}" data-cell="${c}">${path.includes(c)?'<span class="torpedo-wake" aria-hidden="true"></span>':''}</span>`).join('')}</div>`;}
  function render(complete=false){
    const name=scene.value;
    let ships='',effects='',lighting='';
    if(name==='fire'){
      ships=[[{type:'cruiser',x:3,y:3,length:3},false],[{type:'battleship',x:3,y:4,length:4},false],[{type:'cruiser',x:3,y:5,length:3},false],[{type:'destroyer',x:2,y:7,length:2},complete]].map(([s,wreck])=>shipOverlay(s,{wreck})).join('');
      effects=`<div class="board-effects">${Array.from({length:100},(_,c)=>`<span class="effect ${complete?states.get(c)||'':''}">${complete?impactArt(states.get(c)):''}</span>`).join('')}</div>`;
    } else if(name==='illumination'){
      if(complete){lighting=illuminationArt(lit);ships=sightedHullArt([24,25,26],{type:'battleship',length:4},{offset:0,vertical:false},false);}
    } else if(name==='smoke'){
      ships=shipOverlay({type:'destroyer',x:4,y:5,length:2});effects=grid(complete?cloud:[]);
    } else if(name==='overlap') {
      effects=grid(blockingSmoke);
      if(complete){lighting=illuminationArt(unblockedLight);ships=sightedHullArt([25],{type:'battleship',length:4},{offset:0,vertical:true},false);}
    } else {
      ships=shipOverlay({type:'destroyer',x:7,y:5,length:2});effects=grid([],complete?trace:[]);
      if(paths[name])effects=grid([],complete?paths[name].flat():[]);
    }
    board.innerHTML=`${lighting}<div class="lines"></div>${effects}<div class="ships">${ships}</div>`;
    for(const f of board.querySelectorAll('.fire-art'))f.style.animation=still.checked?'none':'';
    document.querySelector('aside').innerHTML=`<p>${descriptions[name]}</p><p>先选择场景与版本，再点击“发射／重播”。每次从无效果的海面开始。勾选“显示完成状态”可检查最终落点。</p><p>此页采用固定场景演示；精修动画与正式对局共用绘制函数，实际范围由对局数据决定。</p><a href="/">进入人机演习 →</a>`;
  }
  function reset(){cancel();document.body.classList.toggle('baseline',version.value==='baseline');render(still.checked);status.textContent=still.checked?'完成状态':'尚未发射 · 点击发射查看全过程';}
  function replay(){
    cancel();still.checked=false;render(false);status.textContent='准备发射…';
    const run=generation;
    timers.push(setTimeout(()=>{
      if(run!==generation)return;
      render(true);
      const refined=version.value==='refined';
      if(scene.value==='fire')playStrikeEffects(document,{playerId:1,results:[...states].map(([cell,result])=>({cell,result}))},1);
      else if(refined)playTacticalEntrance(document,{illumination:['illumination','overlap'].includes(scene.value),illuminationCells:scene.value==='overlap'?unblockedLight:lit,illuminationCenter:35,smokeEnemy:scene.value==='smoke'?cloud:[],traces:paths[scene.value]||[]});
      status.textContent=paths[scene.value]&&refined?'鱼雷航行中…':refined?'效果展开中…':'原版：效果直接出现';
      timers.push(setTimeout(()=>{if(run===generation)status.textContent='播放完成 · 可重播或切换版本对照';},paths[scene.value]&&refined?2700:1700));
    },450));
  }
  scene.addEventListener('change',reset);version.addEventListener('change',reset);still.addEventListener('change',reset);document.querySelector('#replay').addEventListener('click',replay);
  reset();
</script>
</html>
